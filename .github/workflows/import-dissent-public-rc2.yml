name: Publish DISSENT v1.0.0-RC2 source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-dissent-public-rc2.yml

permissions:
  contents: write

jobs:
  import-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and verify signed DISSENT RC2 release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-8b58-81f5-b83b-a73e39e736f3/raw?se=2026-11-11T01%3A00%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=2b08074f-486b-5323-baaa-22b297ae3103&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-10T22%3A37%3A58Z&ske=2026-11-11T22%3A37%3A58Z&sks=b&skv=2026-02-06&sig=oSQE/3r1tcKtDpsQ0XY1Awfluv6Iph9jaTqqY4SpthA%3D' --output /tmp/dissent-release.tgz
          echo 'e71415698e0dd46ae46ed5428524d5cfd2e833a23ad5042fa03c97301f73b873  /tmp/dissent-release.tgz' | sha256sum --check --strict

      - name: Replace public DISSENT release directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dissent
          mkdir -p dissent
          tar -xzf /tmp/dissent-release.tgz -C dissent
          cd dissent
          sha256sum --check RELEASE_MANIFEST_SHA256.txt
          grep -q 'Version: 1.0.0-RC2' VERSION.txt

      - name: Commit RC2 and remove one-shot importer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/import-dissent-public-rc2.yml
          git add -A dissent
          git commit -m 'Publish DISSENT v1.0.0-RC2 adaptive flight deck'
          git push origin HEAD:main
