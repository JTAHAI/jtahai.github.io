name: Build IRON-DAD R34 artifacts

on:
  push:
    branches:
      - artifact/iron-dad-r34
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad

      - name: Optimize OpenSCAD tessellation for release build
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('r34/build.py')
          s = p.read_text()
          s = s.replace('$fn=56;', '$fn=30;')
          s = s.replace('module rounded_box(v=[10,10,10], r=2){ minkowski(){ cube([v[0]-2*r,v[1]-2*r,v[2]-2*r],center=true); sphere(r=r); } }', 'module rounded_box(v=[10,10,10], r=2){ cube(v,center=true); }')
          p.write_text(s)
          PY

      - name: Build IRON-KITTY geometry and website
        run: python r34/build.py

      - name: Upload complete Cloudflare Pages website
        uses: actions/upload-artifact@v4
        with:
          name: IRON_DAD_CLOUDFLARE_PAGES_R34
          path: out/site/
          if-no-files-found: error
          compression-level: 9
          retention-days: 14

      - name: Upload IRON-KITTY geometry package
        uses: actions/upload-artifact@v4
        with:
          name: IRON_KITTY_GEOMETRY_R34
          path: out/model/
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
