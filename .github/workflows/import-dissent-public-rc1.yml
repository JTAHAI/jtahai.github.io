name: Publish DISSENT v1.0.0-RC1 source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-dissent-public-rc1.yml

permissions:
  contents: write

jobs:
  import-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and verify signed DISSENT release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-ba58-81f5-b4db-5d30ab3b0669/raw?se=2026-11-11T00%3A35%3A49Z&sp=r&sv=2026-02-06&sr=b&scid=3db32a1e-2c1f-5f52-b489-afab70122ceb&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-10T22%3A29%3A50Z&ske=2026-11-11T22%3A29%3A50Z&sks=b&skv=2026-02-06&sig=QNA6r1QDBZUM9WyKGLsH/GFUfH76T0%2BbKnBdpQ36GIg%3D' --output /tmp/dissent-release.tgz
          echo '74ed1b3c84271e0f4868ea3ca4a8ad5c118e9a5efb2f8af0adedcb46eae868a2  /tmp/dissent-release.tgz' | sha256sum --check --strict

      - name: Import isolated public DISSENT release directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dissent
          mkdir -p dissent
          tar -xzf /tmp/dissent-release.tgz -C dissent
          cd dissent
          sha256sum --check RELEASE_MANIFEST_SHA256.txt
          cat > vercel.json <<'JSON'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "cleanUrls": true,
            "trailingSlash": false,
            "headers": [
              {
                "source": "/(.*)",
                "headers": [
                  {"key": "X-Content-Type-Options", "value": "nosniff"},
                  {"key": "Referrer-Policy", "value": "strict-origin-when-cross-origin"},
                  {"key": "Permissions-Policy", "value": "camera=(), microphone=(), geolocation=()"}
                ]
              },
              {
                "source": "/index.html",
                "headers": [{"key": "Cache-Control", "value": "public, max-age=0, must-revalidate"}]
              },
              {
                "source": "/(game|generator-core|jetta-model-data).js",
                "headers": [{"key": "Cache-Control", "value": "public, max-age=0, must-revalidate"}]
              },
              {
                "source": "/assets/vehicles/jetta-mkiv/(.*)",
                "headers": [{"key": "Cache-Control", "value": "public, max-age=31536000, immutable"}]
              }
            ]
          }
          JSON

      - name: Commit release and remove one-shot importer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/import-dissent-public-rc1.yml
          git add dissent
          git commit -m 'Publish DISSENT v1.0.0-RC1 source for procedural4'
          git push origin HEAD:main
