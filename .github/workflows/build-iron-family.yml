name: Build IRON-DAD R33 R34 artifacts

on:
  push:
    branches:
      - work/iron-dad-r33-r34-artifacts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy trimesh matplotlib scipy networkx

      - name: Generate engineering packages and website
        run: python iron_family_builder.py

      - name: Show build summary
        run: cat out/BATCH_SUMMARY.json

      - name: Upload R33 full-body integration
        uses: actions/upload-artifact@v4
        with:
          name: IRON_DAD_FULL_BODY_INTEGRATION_R33
          path: out/IRON_DAD_FULL_BODY_INTEGRATION_R33
          if-no-files-found: error
          compression-level: 6
          retention-days: 7

      - name: Upload R34 IRON-KITTY geometry
        uses: actions/upload-artifact@v4
        with:
          name: IRON_KITTY_GEOMETRY_R34
          path: out/IRON_KITTY_GEOMETRY_R34
          if-no-files-found: error
          compression-level: 6
          retention-days: 7

      - name: Upload R34 Cloudflare Pages site
        uses: actions/upload-artifact@v4
        with:
          name: IRON_DAD_CLOUDFLARE_PAGES_R34
          path: out/IRON_DAD_CLOUDFLARE_PAGES_R34
          if-no-files-found: error
          compression-level: 6
          retention-days: 7

      - name: Upload batch summary
        uses: actions/upload-artifact@v4
        with:
          name: IRON_DAD_R33_R34_BATCH_SUMMARY
          path: out/BATCH_SUMMARY.json
          if-no-files-found: error
          retention-days: 7
